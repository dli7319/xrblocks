<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Spatial Colocation | XR Blocks Simulator Testbed</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "xrblocks": "../../build/xrblocks.js"
        }
      }
    </script>
    <!-- async: loadCv() in lib/cv-runtime.js polls for the global cv -->
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c10;
        --panel: rgba(18, 22, 29, 0.88);
        --panel-2: #171c25;
        --line: #232b37;
        --text: #e6edf5;
        --muted: #8b98a8;
        --accent: #38bdf8;
        --ok: #34d399;
        --warn: #fbbf24;
        --err: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        overscroll-behavior: none;
      }
      /* The SDK canvas is the main viewport. */
      #xb-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Panels overlay the viewport and never block simulator input outside
         their own boxes. */
      #hud {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        pointer-events: none;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      #hud > * {
        pointer-events: auto;
        width: min(420px, 100%);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 15px;
        letter-spacing: 0.2px;
      }
      .brand b {
        color: var(--accent);
        font-weight: 700;
      }
      #room-label {
        color: var(--muted);
        font-size: 12px;
      }
      .pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 40%, transparent);
      }
      .pill.warn {
        color: var(--warn);
      }
      .pill.err {
        color: var(--err);
      }
      nav#tabs {
        display: flex;
        gap: 6px;
      }
      nav#tabs .tab {
        flex: 1;
        min-height: 46px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--muted);
        cursor: pointer;
      }
      nav#tabs .tab.active {
        background: color-mix(in srgb, var(--accent) 22%, var(--panel-2));
        color: var(--text);
        border-color: var(--accent);
      }
      #stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
      }
      .stat .k {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .stat .v {
        display: block;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .btn {
        min-height: 46px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.primary {
        background: color-mix(in srgb, var(--accent) 28%, var(--panel-2));
        border-color: var(--accent);
      }
      .btn:active {
        transform: translateY(1px);
      }
      input[type='text'],
      select {
        min-height: 46px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        padding: 0 12px;
        font-size: 14px;
      }
      section.panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      section.panel h2 {
        margin: 0 0 6px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      ul#device-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #device-list li {
        padding: 8px 10px;
        background: var(--panel-2);
        border-radius: 8px;
        font-size: 14px;
      }
      #device-list li.self {
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      }
      #device-list li.empty {
        color: var(--muted);
      }
      pre#log {
        margin: 0;
        max-height: 180px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      pre#log .warn {
        color: var(--warn);
      }
      pre#log .error {
        color: var(--err);
      }
      #feed-badge {
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <canvas id="xb-canvas"></canvas>

    <div id="hud">
      <header>
        <div>
          <div class="brand">Spatial <b>Colocation</b> · sim</div>
          <div id="room-label">—</div>
        </div>
        <div class="pills">
          <span id="pill-net" class="pill">net …</span>
          <span id="pill-source" class="pill">source …</span>
          <span id="pill-xr" class="pill">xr …</span>
        </div>
      </header>

      <nav id="tabs" role="tablist" aria-label="Mode">
        <button class="tab" data-mode="build" role="tab">Build</button>
        <button class="tab" data-mode="relocalize" role="tab">
          Relocalize
        </button>
        <button class="tab" data-mode="live" role="tab">Live</button>
      </nav>

      <section id="stats" aria-label="Stats">
        <div class="stat">
          <span class="k">keyframes</span><span id="st-kf" class="v">0</span>
        </div>
        <div class="stat">
          <span class="k">landmarks</span><span id="st-lm" class="v">0</span>
        </div>
        <div class="stat">
          <span class="k">matches</span><span id="st-mt" class="v">0</span>
        </div>
        <div class="stat">
          <span class="k">proc fps</span><span id="st-fps" class="v">0.0</span>
        </div>
        <div class="stat">
          <span class="k">inliers</span><span id="st-inl" class="v">—</span>
        </div>
      </section>

      <section id="controls">
        <button id="btn-place-cube" class="btn primary">Place cube @1m</button>
        <input id="in-mapname" type="text" placeholder="map name (optional)" />
        <button id="btn-save" class="btn">Save map</button>
        <select id="sel-maps" aria-label="Stored maps"></select>
        <button id="btn-load" class="btn">Load map</button>
      </section>

      <section class="panel">
        <h2>Devices relocalized to this map</h2>
        <ul id="device-list">
          <li class="empty">none yet</li>
        </ul>
      </section>

      <section class="panel">
        <h2>Log</h2>
        <pre id="log"></pre>
        <div id="feed-badge"></div>
      </section>
    </div>

    <script type="module" src="app/sim-main.js"></script>
  </body>
</html>
