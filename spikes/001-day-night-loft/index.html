<!doctype html>
<html lang="en">
  <head>
    <title>Spike 001: Day→Night Loft Cycle</title>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!--
      Spike: sun-free baked base + real-time shadow-mapped sun.

      - Base pass: the EVENING GLB as-is (unlit baked textures contain no sun,
        only artificial/ambient light) -> preserves all baked GI/AO quality.
      - Sun pass: second render of the same meshes with an additive Lambert
        material, lit by ONE directional light whose shadow map is cut by the
        real window holes -> sun patches MOVE as the sun arc changes.
      - Shades: triangles that exist only in the night GLB are split out of the
        wall meshes at load and animated as rolling blinds (scale about the
        housing) + faded in early so t=0 has no hardware at all.
      - Sky: day/night sky-box textures blended on the sky sphere.
      - Rug: a day-only mesh fades out with t.
    -->
    <script type="module">
      import * as THREE from 'three';
      import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

      const ASSETS =
        'https://cdn.jsdelivr.net/gh/xrblocks/assets@5582bd1b2d1a4e19f7ee7093b63a5ee328e974ac/simulator/scenes/';
      const DAY_GLB = ASSETS + 'XREmulatorsceneV5.glb';
      const NIGHT_GLB = ASSETS + 'XREmulatorscene_Dark.glb';

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      // PCF (not PCFSoft) + radius: PCFSoft ignores shadow.radius; the plain PCF
      // kernel with a radius gives a real penumbra that absorbs the shadow map's
      // texel flips at thin window jambs (the hard-edged patch blinked there)
      renderer.shadowMap.type = THREE.PCFShadowMap;
      // one shadow-map render per frame (in pass 1, with the full caster set):
      // letting both passes refresh it made the map flip between two caster
      // sets and the floor patches jumped
      renderer.shadowMap.autoUpdate = false;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      window.__scene = scene; // spike debug hook
      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.05,
        200
      );

      // ---- lights: affect ONLY the additive sun pass (base is unlit) ----
      const sun = new THREE.DirectionalLight(0xffffff, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      sun.shadow.camera.near = 20;
      sun.shadow.camera.far = 60;
      sun.shadow.camera.left = -11;
      sun.shadow.camera.right = 11;
      sun.shadow.camera.top = 11;
      sun.shadow.camera.bottom = -11;
      sun.shadow.bias = -0.0005;
      sun.shadow.normalBias = 0.08;
      sun.shadow.radius = 30;
      const sunTarget = new THREE.Object3D();
      sunTarget.position.set(0, 1.5, 0.5);
      scene.add(sunTarget);
      sun.target = sunTarget;
      scene.add(sun);

      // window bounce: light flooding in low from the sun's azimuth (no shadow)
      // - shaped like real light, unlike a flat hemisphere fill
      const bounce = new THREE.DirectionalLight(0xfff3e0, 0);
      const bounceTarget = new THREE.Object3D();
      bounceTarget.position.set(0, 1.0, 0);
      scene.add(bounceTarget);
      bounce.target = bounceTarget;
      scene.add(bounce);

      // faint sky lift so corners do not crush to pure black
      const skyFill = new THREE.HemisphereLight(0x87b5ff, 0x3a2f28, 0.6);
      scene.add(skyFill);

      // additive sun/sky-fill material for the second pass
      const sunMat = new THREE.MeshLambertMaterial({
        color: 0xffffff,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
      });

      // ---- helpers ----
      const qkey = (v) =>
        [v.x, v.y, v.z].map((x) => Math.round(x * 200)).join(',');

      function collectMeshes(root) {
        root.updateMatrixWorld(true);
        const out = [];
        root.traverse((o) => {
          if (!o.isMesh) return;
          const box = new THREE.Box3().setFromObject(o);
          const pos = o.geometry.getAttribute('position');
          const world = new THREE.Vector3();
          const verts = new Set();
          const worldPositions = [];
          for (let i = 0; i < pos.count; i++) {
            world
              .fromBufferAttribute(pos, i)
              .applyMatrix4(o.matrixWorld)
              .toArray();
            worldPositions.push(world.clone());
            verts.add(qkey(world));
          }
          out.push({
            mesh: o,
            center: box.getCenter(new THREE.Vector3()),
            size: box.getSize(new THREE.Vector3()),
            verts,
            worldPositions,
          });
        });
        return out;
      }

      // Split triangles whose verts are (mostly) in the extra-vert set into a
      // separate mesh (baked to world space), leaving the rest behind.
      function splitMesh(entry, extraKeys) {
        const mesh = entry.mesh;
        const geo = mesh.geometry;
        const pos = geo.getAttribute('position');
        const uv = geo.getAttribute('uv');
        const index = geo.index;
        const triCount = index ? index.count / 3 : pos.count / 3;
        const isExtra = entry.worldPositions.map((p) => extraKeys.has(qkey(p)));

        const shade = {pos: [], uv: []};
        const wall = {pos: [], uv: []};
        const world = new THREE.Vector3();
        for (let t = 0; t < triCount; t++) {
          const i0 = index ? index.getX(t * 3) : t * 3;
          const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;
          const n = isExtra[i0] + isExtra[i1] + isExtra[i2];
          const bucket = n >= 2 ? shade : wall;
          for (const i of [i0, i1, i2]) {
            world.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
            bucket.pos.push(world.x, world.y, world.z);
            if (uv) bucket.uv.push(uv.getX(i), uv.getY(i));
          }
        }
        const make = (bucket) => {
          const g = new THREE.BufferGeometry();
          g.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(bucket.pos, 3)
          );
          if (bucket.uv.length)
            g.setAttribute('uv', new THREE.Float32BufferAttribute(bucket.uv, 2));
          g.computeVertexNormals();
          return g;
        };
        return {shadeGeo: make(shade), wallGeo: make(wall)};
      }

      // Split a shade geometry into per-window blind groups (clustered in the
      // x/z plane) so each blind rolls about its OWN housing top, not one
      // shared edge (windows sit at different heights on different walls).
      function clusterBlinds(shadeGeo) {
        const pos = shadeGeo.getAttribute('position');
        const uv = shadeGeo.getAttribute('uv');
        const triCount = pos.count / 3;
        const cents = [];
        for (let i = 0; i < triCount; i++) {
          cents.push([
            (pos.getX(i * 3) + pos.getX(i * 3 + 1) + pos.getX(i * 3 + 2)) / 3,
            (pos.getY(i * 3) + pos.getY(i * 3 + 1) + pos.getY(i * 3 + 2)) / 3,
            (pos.getZ(i * 3) + pos.getZ(i * 3 + 1) + pos.getZ(i * 3 + 2)) / 3,
          ]);
        }
        const parent = [...Array(triCount).keys()];
        const find = (a) => (parent[a] === a ? a : (parent[a] = find(parent[a])));
        const R = 0.6;
        for (let i = 0; i < triCount; i++)
          for (let j = i + 1; j < triCount; j++) {
            const dx = cents[i][0] - cents[j][0];
            const dz = cents[i][2] - cents[j][2];
            if (dx * dx + dz * dz < R * R) parent[find(i)] = find(j);
          }
        const groups = new Map();
        for (let i = 0; i < triCount; i++) {
          const r = find(i);
          if (!groups.has(r)) groups.set(r, []);
          groups.get(r).push(i);
        }
        const out = [];
        for (const tris of groups.values()) {
          const bucket = {pos: [], uv: []};
          let topY = -1e9;
          for (const t of tris) {
            for (let k = 0; k < 3; k++) {
              const i = t * 3 + k;
              bucket.pos.push(pos.getX(i), pos.getY(i), pos.getZ(i));
              if (uv) bucket.uv.push(uv.getX(i), uv.getY(i));
              topY = Math.max(topY, pos.getY(i));
            }
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(bucket.pos, 3)
          );
          if (bucket.uv.length)
            g.setAttribute('uv', new THREE.Float32BufferAttribute(bucket.uv, 2));
          g.computeVertexNormals();
          out.push({geo: g, topY});
        }
        return out;
      }

      const state = {
        shadeGroups: [], // {mesh, topY}
        rug: null,
        skyMix: null, // uniform for sky blend
        baseExposure: 1.36,
        blendMeshes: [], // {mesh, mapDay, mapNight, uvScale}
        noSunMeshes: [], // outdoor meshes excluded from the additive sun pass
        sky: null, // sky sphere (its blend is the skyMix uniform)
        ready: false,
      };
      window.__state = state; // spike debug hook

      // ---- time-of-day controller ----
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      function setTimeOfDay(t) {
        // HYBRID: baked day/night bakes cross-fade as the base (mixU), and a
        // real-time shadow-mapped sun carries the moving directional light on
        // top. Additive terms are ZERO at both endpoints so t=0 renders the
        // reference Daytime Loft bake and t=1 the Evening Loft bake as-is.
        const mixU = smoothstep(0.3, 0.72, t); // base: day bake -> night bake
        for (const b of state.blendMeshes) {
          const sh = b.mat.userData.shader;
          if (sh) sh.uniforms.mixU.value = mixU;
        }
        // sun arc: aligned with the day bake's baked patch at t=0, then moves.
        // Additive strength tracks mixU: the real sun REPLACES the baked sun
        // exactly as the day bake fades out - never doubles it (that was the
        // over-bright middle).
        const dayness = 1 - smoothstep(0.58, 0.8, t);
        const elevation = THREE.MathUtils.degToRad(
          50 - 48 * smoothstep(0.0, 0.8, t)
        );
        const azimuth = THREE.MathUtils.degToRad(-50 + 95 * t);
        const r = 30;
        sun.position.set(
          Math.cos(elevation) * Math.cos(azimuth) * r,
          Math.sin(elevation) * r,
          Math.cos(elevation) * Math.sin(azimuth) * r
        );
        sun.intensity = 0.85 * mixU * dayness;
        const warmth = smoothstep(0.35, 0.8, t);
        sun.color.setRGB(1, 1 - 0.35 * warmth, 1 - 0.72 * warmth);
        // bounce: low directional flood from the sun's azimuth, transition only
        const bElev = THREE.MathUtils.degToRad(20);
        bounce.position.set(
          Math.cos(bElev) * Math.cos(azimuth) * r,
          Math.sin(bElev) * r,
          Math.cos(bElev) * Math.sin(azimuth) * r
        );
        bounce.intensity = 0.55 * mixU * (1 - smoothstep(0.55, 0.82, t));
        bounce.color.setRGB(1, 0.97 - 0.12 * warmth, 0.9 - 0.3 * warmth);
        // faint corner lift during the dark half only (endpoints stay pure)
        skyFill.intensity = 0.05 * mixU * (1 - smoothstep(0.5, 0.85, t));
        skyFill.color.setRGB(
          0.55 - 0.4 * warmth,
          0.66 - 0.5 * warmth,
          0.88 - 0.56 * warmth
        );
        // endpoints render the reference bakes at exposure 1
        state.baseExposure = 1.0;
        // sky texture blend follows the same mix
        if (state.skyMix) state.skyMix.value = mixU;
        // rolling blinds: hardware fades in just as the roll starts
        const hardware = smoothstep(0.47, 0.56, t);
        const roll = smoothstep(0.5, 0.82, t);
        for (const s of state.shadeGroups) {
          s.mesh.visible = hardware > 0.01;
          s.mesh.material.opacity = hardware;
          s.mesh.scale.y = 0.04 + 0.96 * roll;
        }
        // day-only rug fades out before the night half
        if (state.rug) {
          state.rug.material.opacity = 1 - smoothstep(0.3, 0.65, t);
          state.rug.visible = state.rug.material.opacity > 0.01;
        }
      }

      // ---- camera paths (slow drift per shot) ----
      const SHOTS = {
        // 0: interior drift toward the window wall (original)
        0: (p) => {
          const a = THREE.MathUtils.degToRad(-8 + 26 * p);
          return {
            pos: [-0.4 + 1.6 * p + 0.4 * Math.sin(a), 1.62, 1.9 + 0.5 * Math.sin(a * 0.7)],
            look: [3.2, 1.05, -1.6],
          };
        },
        // 1: reverse angle from the TV corner, sun patches sweep toward camera
        1: (p) => ({
          pos: [3.7 - 0.5 * p, 1.55, -3.3 + 0.7 * p],
          look: [-1.6, 1.15, 1.6],
        }),
        // 2: mid-height angle across the seating group toward the +x windows
        2: (p) => ({
          pos: [0.3 + 0.6 * p, 1.28, 3.3 - 0.5 * p],
          look: [3.9, 0.8, -1.4],
        }),
        // 3: slow orbit around the seating group
        3: (p) => {
          const a = THREE.MathUtils.degToRad(105 + 55 * p);
          return {
            pos: [1.7 + 2.7 * Math.sin(a), 1.5, -1.0 + 2.7 * Math.cos(a)],
            look: [1.7, 0.95, -1.2],
          };
        },
        // 4: push-in from the office doorway toward the windows
        4: (p) => ({
          pos: [-0.7 + 2.6 * p, 1.62, 1.5 - 1.1 * p],
          look: [4.1, 1.35, -1.7],
        }),
      };

      function setCamera(p, shot = 0) {
        const s = (SHOTS[shot] || SHOTS[0])(p);
        camera.position.set(...s.pos);
        camera.lookAt(...s.look);
      }

      // ---- render ----
      function renderFrame() {
        renderer.shadowMap.needsUpdate = true;
        renderer.autoClear = true;
        renderer.toneMappingExposure = state.baseExposure; // pass 1: baked base
        renderer.render(scene, camera);
        renderer.autoClear = false;
        renderer.toneMappingExposure = 1.0; // pass 2: additive sun at exposure 1
        // pass 2: additive sun + sky fill (hide sky sphere: it is not "lit")
        const skyVisible = state.sky ? state.sky.visible : false;
        if (state.sky) state.sky.visible = false;
        for (const m of state.noSunMeshes) m.visible = false; // outdoor: baked
        const rugVis = state.rug ? state.rug.visible : false;
        if (state.rug) state.rug.visible = false; // fading rug: no additive draw
        scene.overrideMaterial = sunMat;
        renderer.render(scene, camera);
        scene.overrideMaterial = null;
        if (state.sky) state.sky.visible = skyVisible;
        for (const m of state.noSunMeshes) m.visible = true;
        if (state.rug) state.rug.visible = rugVis;
        renderer.autoClear = true;
      }

      window.__frame = (t, p, shot = 0) => {
        setTimeOfDay(t);
        setCamera(p, shot);
        renderFrame();
      };
      window.__render = renderFrame; // spike debug hook

      // ---- load both GLBs ----
      const loader = new GLTFLoader();
      const load = (url) =>
        new Promise((res, rej) => loader.load(url, res, undefined, rej));

      // Bake each mesh's world transform into its geometry so meshes can be
      // re-parented freely (GLTF nodes carry TRS above the meshes).
      function bakeWorldTransforms(root) {
        root.updateMatrixWorld(true);
        root.traverse((o) => {
          if (!o.isMesh) return;
          o.geometry = o.geometry.clone().applyMatrix4(o.matrixWorld);
          o.position.set(0, 0, 0);
          o.rotation.set(0, 0, 0);
          o.scale.set(1, 1, 1);
        });
      }

      // ---- day/night texture blend (the base "GI layer") ----
      // Two bakes of the same room: base = mapDay at day, mapNight at night,
      // cross-faded by the global mixU. Endpoints stay pixel-faithful to the
      // reference GLBs; the moving sun lives in the additive pass on top.
      function buildBlendMaterial(mapDay, mapNight, delta, extra = {}) {
        const m = new THREE.MeshBasicMaterial({map: mapDay, ...extra});
        m.onBeforeCompile = (shader) => {
          shader.uniforms.mapNight = {value: mapNight};
          shader.uniforms.mixU = {value: 0};
          shader.uniforms.nightUvDelta = {
            value: new THREE.Vector2(delta[0], delta[1]),
          };
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              '#include <common>\nuniform sampler2D mapNight;\nuniform float mixU;\nuniform vec2 nightUvDelta;'
            )
            .replace(
              '#include <map_fragment>',
              `{
                vec4 texDay = texture2D( map, vMapUv );
                vec4 texNight = texture2D( mapNight, vMapUv + nightUvDelta );
                vec4 sampledDiffuseColor = mix( texDay, texNight, mixU );
                diffuseColor *= sampledDiffuseColor;
              }`
            );
          m.userData.shader = shader;
        };
        m.customProgramCacheKey = () => 'blendmap';
        return m;
      }

      // Uniform UV mapping ("plane18"-style GLB export): uv = pos[plane] *
      // scale + offset. Recover scale/offset from the day mesh's geometry/UV
      // bounds and verify against the night mesh's UVs.
      function uvMapping(d, n) {
        const dbb = new THREE.Box3().setFromBufferAttribute(
          d.mesh.geometry.getAttribute('position')
        );
        const nb = new THREE.Box3().setFromBufferAttribute(
          n.mesh.geometry.getAttribute('position')
        );
        const uvBounds = (attr) => {
          const b = [1e9, 1e9, -1e9, -1e9];
          for (let i = 0; i < attr.count; i++) {
            b[0] = Math.min(b[0], attr.getX(i));
            b[1] = Math.min(b[1], attr.getY(i));
            b[2] = Math.max(b[2], attr.getX(i));
            b[3] = Math.max(b[3], attr.getY(i));
          }
          return b;
        };
        const duv = uvBounds(d.mesh.geometry.getAttribute('uv'));
        // choose the plane (x=0,y=1,z=2) whose day/night position spans match
        let best = null;
        for (const [a, b] of [
          [0, 1],
          [0, 2],
          [1, 2],
        ]) {
          const err =
            Math.abs(
              dbb.max.getComponent(a) -
                dbb.min.getComponent(a) -
                (nb.max.getComponent(a) - nb.min.getComponent(a))
            ) +
            Math.abs(
              dbb.max.getComponent(b) -
                dbb.min.getComponent(b) -
                (nb.max.getComponent(b) - nb.min.getComponent(b))
            );
          if (!best || err < best.err) best = {a, b, err};
        }
        const {a, b} = best;
        const spanA = dbb.max.getComponent(a) - dbb.min.getComponent(a) || 1;
        const spanB = dbb.max.getComponent(b) - dbb.min.getComponent(b) || 1;
        const scale = [(duv[2] - duv[0]) / spanA, (duv[3] - duv[1]) / spanB];
        const offset = [
          duv[0] - dbb.min.getComponent(a) * scale[0],
          duv[1] - dbb.min.getComponent(b) * scale[1],
        ];
        return {
          scale,
          offset,
          plane: [a, b],
          uvBB: [duv[0], duv[1], duv[2] - duv[0], duv[3] - duv[1]],
        };
      }

      // Re-project a mesh's UVs onto the day mapping (night bakes can have
      // shifted UV origins; projecting both onto one mapping keeps the blend
      // registered).
      function applyUvMapping(geo, map) {
        const pos = geo.getAttribute('position');
        const uv = geo.getAttribute('uv');
        const [a, b] = map.plane;
        for (let i = 0; i < pos.count; i++) {
          uv.setXY(
            i,
            pos.getComponent(i, a) * map.scale[0] + map.offset[0],
            pos.getComponent(i, b) * map.scale[1] + map.offset[1]
          );
        }
        uv.needsUpdate = true;
      }

      Promise.all([load(NIGHT_GLB), load(DAY_GLB)]).then(
        ([night, day]) => {
          const root = new THREE.Group();
          root.name = 'Loft (night base)';
          scene.add(root);

          bakeWorldTransforms(night.scene);
          bakeWorldTransforms(day.scene);
          const dayEntries = collectMeshes(day.scene);
          const nightEntries = collectMeshes(night.scene);

          // pair night meshes to day meshes by world bounds
          const used = new Set();
          const pairs = [];
          for (const n of nightEntries) {
            let best = -1;
            dayEntries.forEach((d, i) => {
              if (used.has(i)) return;
              if (
                n.center.distanceTo(d.center) < 0.05 &&
                n.size.distanceTo(d.size) < 0.05
              )
                best = i;
            });
            if (best >= 0) {
              used.add(best);
              pairs.push({n, d: dayEntries[best]});
            }
          }

          // day-only meshes -> rug-like state meshes (fade out with t)
          dayEntries.forEach((d, i) => {
            if (used.has(i)) return;
            const mesh = d.mesh.clone();
            mesh.geometry = d.mesh.geometry.clone();
            mesh.geometry.computeVertexNormals();
            mesh.material = d.mesh.material.clone();
            mesh.material.transparent = true;
            // the floor surface undulates through the rug's thickness (both
            // sit at y~0.01-0.1) - bias the rug toward the camera so it cannot
            // z-fight the floor while fading
            mesh.material.polygonOffset = true;
            mesh.material.polygonOffsetFactor = -2;
            mesh.material.polygonOffsetUnits = -2;
            root.add(mesh);
            state.rug = mesh;
          });

          const shadeReport = [];
          const blendReport = [];
          for (const {n, d} of pairs) {
            // MAIN BODY: day geometry + day/night blended texture. The day bake
            // carries no shade tris, so its geometry is exactly the wall/prop
            // body; the night texture is sampled at (uv + delta) to undo the
            // night bake's shifted UV origin.
            const dayMap = uvMapping(d, n);
            const nightMap = uvMapping(n, d);
            const delta = [
              nightMap.offset[0] - dayMap.offset[0],
              nightMap.offset[1] - dayMap.offset[1],
            ];
            const mat = buildBlendMaterial(
              d.mesh.material.map,
              n.mesh.material.map,
              delta,
              {key: d.mesh.material.name}
            );
            const body = d.mesh.clone();
            body.geometry = d.mesh.geometry.clone();
            body.material = mat;
            root.add(body);
            if (/outside|sky/i.test(d.mesh.material.name))
              state.noSunMeshes.push(body); // outdoor stays baked
            state.blendMeshes.push({mat, delta});
            blendReport.push({
              name: d.mesh.material.name,
              delta: delta.map((x) => +x.toFixed(4)),
              scaleMismatch: +Math.abs(
                dayMap.scale[0] - nightMap.scale[0]
              ).toFixed(5),
            });

            // night-only verts = the state geometry (shades). Only the room
            // shells carry window shades; other diffs (moved props, lamp
            // re-tessellation) snap to the night state.
            const isRoomShell = /Bake home office|Bake living room bottom/.test(
              n.mesh.material.name
            );
            const extra = isRoomShell
              ? new Set([...n.verts].filter((v) => !d.verts.has(v)))
              : new Set();
            if (extra.size < 12) continue;
            const {shadeGeo} = splitMesh(n, extra);
            if (shadeGeo.getAttribute('position').count > 0) {
              for (const blind of clusterBlinds(shadeGeo)) {
                const shade = n.mesh.clone();
                shade.geometry = blind.geo;
                shade.material = n.mesh.material.clone();
                const topY = blind.topY;
                if (topY < 0.5) {
                  // stray night-only floor bits: redundant surface over the
                  // blend floor - drop entirely (it z-fought the floor)
                  continue;
                }
                shade.material.transparent = true;
                // scale about this blind's own housing top edge
                shade.geometry.translate(0, -topY, 0);
                shade.position.y = topY;
                root.add(shade);
                state.shadeGroups.push({mesh: shade, topY});
                shadeReport.push({
                  from: n.mesh.material.name,
                  tris: blind.geo.getAttribute('position').count / 3,
                  topY: +topY.toFixed(2),
                });
              }
            }
          }
          // walls/others keep shadows; shades cast too
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });

          // sky sphere: biggest box, blend its two textures
          let skyN = null,
            skyD = null;
          for (const e of nightEntries)
            if (!skyN || e.size.length() > skyN.size.length()) skyN = e;
          for (const e of dayEntries)
            if (!skyD || e.size.length() > skyD.size.length()) skyD = e;
          if (skyN && skyD) {
            const sky = skyN.mesh;
            root.add(sky);
            sky.castShadow = false;
            sky.receiveShadow = false;
            const mixU = {value: 0};
            const mat = sky.material.clone();
            mat.onBeforeCompile = (shader) => {
              shader.uniforms.mapDay = {value: skyD.mesh.material.map};
              shader.uniforms.uMix = mixU;
              shader.fragmentShader =
                'uniform sampler2D mapDay;\nuniform float uMix;\n' +
                shader.fragmentShader.replace(
                  '#include <map_fragment>',
                  `
                  vec4 texelDay = texture2D( mapDay, vMapUv );
                  vec4 texelNight = texture2D( map, vMapUv );
                  diffuseColor *= mix( texelDay, texelNight, uMix );
                  `
                );
            };
            sky.material = mat;
            state.sky = sky;
            state.skyMix = mixU;
          }

          window.__info = {
            pairs: pairs.length,
            shades: shadeReport,
            blends: blendReport,
            rug: state.rug ? state.rug.material.name : null,
          };
          setTimeOfDay(0);
          setCamera(0);
          renderFrame();
          window.__ready = true;
        },
        (err) => {
          window.__loadError = String(err);
          window.__ready = true;
        }
      );
    </script>
  </body>
</html>
